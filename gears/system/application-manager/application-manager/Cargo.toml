[package]
name = "cf-gears-application-manager"
description = "application-manager gear"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["api-bindings"]
metadata.docs.rs.all-features = true

[lib]
name = "application_manager"

[lints]
workspace = true

[dependencies]
application-manager-sdk = { workspace = true }

types-registry = { workspace = true }
authz-resolver = { workspace = true }
# Policy adapter (P6, DESIGN §3.3 "Authorization"): the PolicyEnforcer and the authz API
# (the gear crate above is only linked for the `deps` entry).
authz-resolver-sdk = { workspace = true }
# Request orchestrator (P6, DESIGN §3.2): the caller's `SecurityContext`, and the SHA-256
# digest of a never-storable uninstall id carried in the request hand-off (DESIGN §3.1),
# through the FIPS-validated aws-lc-rs provider (DE0708), as lower-case hex text.
toolkit-security = { workspace = true }
aws-lc-rs = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
humantime-serde = { workspace = true }
serde = { workspace = true }
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# `v7`: the production request-id source (time-ordered ids).
uuid = { workspace = true, features = ["v7"] }
types-registry-sdk = { workspace = true }
futures = { workspace = true }
toolkit-db = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
time = { workspace = true }
# Schema Validator (P5, DESIGN §3.2): JSON Schema 2020-12 through the workspace crate, with
# default features off (no HTTP or file reference resolution) and an explicit retriever and
# pattern options.
jsonschema = { workspace = true }

[dev-dependencies]
# Startup tests (P3): fake types registry (`MockTypesRegistryClient` builders), tenant
# resolver tripwire, canonical errors, security context.
types-registry-sdk = { workspace = true, features = ["test-util"] }
# ADR 0007: the gear never uses a tenant service. This crate is a test-only tripwire
# (it counts calls a startup must not make) and must never become a normal dependency.
tenant-resolver-sdk = { workspace = true }
toolkit-canonical-errors = { workspace = true }
tracing-subscriber = { workspace = true }
# F-008 tests: the bearer token the PDP receives.
secrecy = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# Registry persistence tests (P4, DESIGN §3.7, §4.8): the backends the tests run against.
toolkit-db = { workspace = true, features = ["sqlite", "pg", "mysql"] }
# SQLite file database per test: a second raw connection introspects the schema, which an
# in-memory database cannot offer.
tempfile = { workspace = true }
# Postgres and MySQL lanes (`make test-application-manager-pg`, `make test-application-manager-mysql`,
# Docker): pinned images via test-containers.
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }
