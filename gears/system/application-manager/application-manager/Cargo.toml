[package]
name = "cf-gears-application-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Application Manager gear - learns which applications are installed and dispatches manifest sections to section plugins"
repository.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "application_manager"

[lints]
workspace = true

[dependencies]
# Local dependencies
application-manager-sdk = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-utils = { workspace = true, features = ["humantime-serde"] }

# GTS (section plugin type registration check)
gts = { workspace = true }

# Gears named in the `deps` of the gear declaration, and the registry client
types-registry = { workspace = true }
types-registry-sdk = { workspace = true }
authz-resolver = { workspace = true }

# Raw request bodies of the request orchestrator
bytes = { workspace = true }

# Async runtime
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }

# Section schema validation (DESIGN 3.2)
jsonschema = { workspace = true }
percent-encoding = { workspace = true }

# REST
axum = { workspace = true }
utoipa = { workspace = true }

# Error handling and serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# Operation storage (DESIGN 3.7); driver features come from the host binary
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
toolkit-db = { workspace = true }
toolkit-db-macros = { workspace = true }
time = { workspace = true }
# SHA-256 of out-of-limit ids (DE0708 bans the `sha2` crate)
aws-lc-rs = { workspace = true }

# Required by toolkit::gear macro
inventory = { workspace = true }

# Logging
tracing = { workspace = true }

[features]
# Gates the container-backed PostgreSQL / MySQL storage tests; they need a
# Docker daemon. Run with `make test-integration LANE=application-manager-db`.
integration = ["toolkit-db/pg", "toolkit-db/mysql"]

[dev-dependencies]
noop-section-plugin = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite"] }
time = { workspace = true, features = ["macros"] }
# PostgreSQL / MySQL bring-up for the `integration` suite; every use is behind
# `#![cfg(feature = "integration")]`.
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
test-containers = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "net"] }
types-registry-sdk = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
proptest = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
