[package]
name = "cf-gears-application-manager"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Application Manager gear - learns which applications are installed and dispatches manifest sections to section plugins"
repository.workspace = true
keywords = ["constructorfabric", "cf-gears"]
categories = ["web-programming"]
metadata.docs.rs.all-features = true

[lib]
name = "application_manager"

[lints]
workspace = true

[dependencies]
# Local dependencies
application-manager-sdk = { workspace = true }

# ToolKit dependencies
toolkit = { workspace = true }
toolkit-macros = { workspace = true }
toolkit-gts = { workspace = true }
toolkit-security = { workspace = true }
toolkit-canonical-errors = { workspace = true }
toolkit-utils = { workspace = true, features = ["humantime-serde"] }

# GTS (section plugin type registration check)
gts = { workspace = true }

# Gears named in the `deps` of the gear declaration, and their client APIs
types-registry = { workspace = true }
types-registry-sdk = { workspace = true }
authz-resolver = { workspace = true }
authz-resolver-sdk = { workspace = true }

# Async runtime
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true }

# REST
axum = { workspace = true }
utoipa = { workspace = true }

# Error handling and serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true, features = ["v7"] }

# Required by toolkit::gear macro
inventory = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
types-registry-sdk = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
